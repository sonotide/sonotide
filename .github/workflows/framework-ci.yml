name: Framework CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: framework-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    runs-on: windows-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: Debug
            preset: ci-ninja-debug
            artifact_name: sonotide-sdk-debug
            install_dir: build/install/ci-ninja-debug
          - configuration: Release
            preset: ci-ninja-release
            artifact_name: sonotide-sdk-release
            install_dir: build/install/ci-ninja-release

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Configure with CMake preset
        run: cmake --preset ${{ matrix.preset }}

      - name: Read configured project version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath "build/${{ matrix.preset }}/SonotideVersion.txt" -Raw).Trim()
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Configured Sonotide version '$version' is invalid."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build with CMake preset
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Run tests with CTest preset
        run: ctest --preset ${{ matrix.preset }}

      - name: Install package tree
        run: cmake --install build/${{ matrix.preset }}

      - name: Relocate installed package tree
        shell: pwsh
        run: |
          $relocatedDir = "build/relocated-${{ matrix.preset }}"
          Move-Item -LiteralPath "${{ matrix.install_dir }}" -Destination $relocatedDir

      - name: Configure smoke consumer against relocated package
        run: >
          cmake -S packaging/smoke-consumer
          -B build/smoke-consumer-${{ matrix.preset }}
          -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
          "-DSONOTIDE_EXPECTED_VERSION=${{ steps.version.outputs.version }}"
          "-DCMAKE_PREFIX_PATH=${{ github.workspace }}/build/relocated-${{ matrix.preset }}"

      - name: Build smoke consumer
        run: cmake --build build/smoke-consumer-${{ matrix.preset }}

      - name: Run smoke consumer
        run: ctest --test-dir build/smoke-consumer-${{ matrix.preset }} --output-on-failure

      - name: Upload install tree artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact_name }}
          path: build/relocated-${{ matrix.preset }}
          if-no-files-found: error

  address-sanitizer:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Configure with AddressSanitizer
        run: cmake --preset ci-ninja-asan

      - name: Build with AddressSanitizer
        run: cmake --build --preset ci-ninja-asan

      - name: Run tests with AddressSanitizer
        run: ctest --preset ci-ninja-asan
